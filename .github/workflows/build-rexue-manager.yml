name: Build Rexue Manager PRO
on:
  workflow_dispatch:
  push:
    branches: [rexue-manager-pro]
    paths: ['manager_pro/**', '.github/workflows/build-rexue-manager.yml']
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r manager_pro/requirements.txt
      - name: Test source
        run: python manager_pro/app_v4.py --self-test --test-report source-test.json
      - name: Build original PRO interface
        run: pyinstaller --noconfirm --clean --onefile --windowed --name RexueManagerPRO --hidden-import googleapiclient.discovery --hidden-import google_auth_oauthlib.flow --hidden-import google.oauth2.credentials --hidden-import test_pro --paths manager_pro manager_pro/app_v4.py
      - name: Test packaged EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/RexueManagerPRO.exe -ArgumentList '--self-test','--test-report','exe-test.json' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'EXE self-test failed' }
          if (!(Test-Path exe-test.json)) { throw 'EXE did not produce test report' }
          $report = Get-Content exe-test.json | ConvertFrom-Json
          if (!$report.ok) { throw 'EXE tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: RexueManagerPRO-v4.1-verified
          path: |
            dist/RexueManagerPRO.exe
            source-test.json
            exe-test.json
          if-no-files-found: error
