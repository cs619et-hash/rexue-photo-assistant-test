name: Build Rexue Manager PRO

on:
  workflow_dispatch:
  push:
    branches: ["rexue-manager-pro"]
    paths:
      - "manager_pro/**"
      - ".github/workflows/build-rexue-manager.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: powershell
        run: pip install -r manager_pro/requirements.txt
      - name: Build EXE
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "RexueManagerPRO" --hidden-import googleapiclient.discovery --hidden-import google_auth_oauthlib.flow --hidden-import google.oauth2.credentials manager_pro/app_v3.py
      - name: Prepare package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/RexueManagerPRO.exe package/RexueManagerPRO.exe
          Set-Content -Path package/README.txt -Encoding UTF8 -Value @"
          熱血少年｜拍攝工作管理中心 PRO v3

          修正：
          - Google 授權改成背景執行，不會再像當機。
          - 同步改成背景執行，首頁會顯示目前進度。
          - Google 授權完成後會自動測試 Drive 與 Sheets。
          - 發生錯誤會跳出明確訊息並寫入 %APPDATA%\RexueManager\rexue_manager.log

          第一次使用：
          1. client_secret.json 與 RexueManagerPRO.exe 放同一資料夾。
          2. 開啟 EXE → 連線設定 → 連接 Google 帳號。
          3. 在瀏覽器完成一次 Google 授權。
          4. 回到程式等候「Google 授權與連線測試成功」。
          "@
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: RexueManagerPRO-Windows-v3
          path: package/*
          if-no-files-found: error
